<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sure Vouch merchant scanner — and validating and redeeming vouchers powered by Dash Platform.">
  <title>Sure Vouch — Merchant Scanner</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blob bg-blob--1"></div>
  <div class="bg-blob bg-blob--2"></div>

  <!-- Theme toggle -->
  <div class="theme-toggle">
    <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
    <button class="theme-toggle__btn" aria-label="Toggle dark mode"></button>
    <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
  </div>

  <!-- Logo -->
  <div class="app-header">
    <img src="assets/surevouch_logo.png" alt="Sure Vouch Logo" class="app-logo">
    <div class="app-title-group">
      <span class="app-title">Sure Vouch</span>
      <span class="app-subtitle">Powered by Dash</span>
    </div>
  </div>

  <!-- Nav -->
  <nav>
    <a href="index.html">Admin Station</a>
    <a href="scanner.html" class="active">Merchant Scanner</a>
  </nav>

  <div class="container">
    <h1>Scan Voucher</h1>
    <p class="subtitle">Validate and execute Dash conditionally.</p>
    
    <!-- Scanner with laser overlay -->
    <div id="reader">
      <div class="scan-laser"></div>
    </div>

    <div id="statusBox" class="status-box"></div>
    
    <div id="txPanel" class="tx-panel">
      <div class="tx-icon">✅</div>
      <h2 style="color: var(--valid-text); font-family: 'Manrope', sans-serif;">Payment Successful</h2>
      <div class="tx-data">
        <span class="tx-label">Tx ID</span> <span class="tx-value monospace" id="txIdDisplay">...</span>
        <span class="tx-label">Amount</span> <span class="tx-value" id="txAmountDisplay">...</span>
        <span class="tx-label">Time</span> <span class="tx-value" id="txTimeDisplay">...</span>
      </div>
    </div>
    
    <button id="redeemBtn" class="redeem-btn" style="display: none;">Redeem Voucher</button>
    <button id="scanAgainBtn" style="display: none; background: var(--text-muted);">Scan Another Voucher</button>
  </div>

  <!-- Toast container for notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/scannerController.js"></script>
</body>
</html>
