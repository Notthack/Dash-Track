<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Admin station for issuing and revoking trust-verified Dash vouchers.">
  <title>Admin Station — Dash Voucher</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

  <!-- Animated background blobs -->
  <div class="bg-blob bg-blob--1"></div>
  <div class="bg-blob bg-blob--2"></div>

  <!-- Theme toggle -->
  <div class="theme-toggle">
    <span class="theme-toggle__icon theme-toggle__icon--sun">☀️</span>
    <button class="theme-toggle__btn" aria-label="Toggle dark mode"></button>
    <span class="theme-toggle__icon theme-toggle__icon--moon">🌙</span>
  </div>

  <!-- Logo -->
  <div class="app-header">
    <img src="assets/dash_logo.png" alt="Dash Logo" class="app-logo">
    <span class="app-title">Trust-Verified Payments</span>
  </div>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="active">Admin Station</a>
    <a href="scanner.html">Merchant Scanner</a>
  </nav>

  <div class="container">
    <h1>Generate Voucher</h1>
    <p class="subtitle">Securely mint a new Dash authorization token.</p>
    
    <button id="issueBtn">Generate New QR (10 DASH)</button>

    <div id="qrWrapper" class="qr-wrapper" style="display: none;">
      <div id="qrcode"></div>
      <div id="voucherIdDisplay" class="voucher-id"></div>
    </div>

    <div class="revoke-panel">
      <h3>Revoke Active Voucher</h3>
      <div class="input-group">
        <input type="text" id="revokeInput" placeholder="Enter Voucher ID to revoke...">
        <button id="revokeBtn" class="revoke-btn">Revoke</button>
      </div>
    </div>
    
    <div class="transactions-panel">
      <h2>Recent Transactions</h2>
      <div class="table-container">
        <table id="txTable">
          <thead>
            <tr>
              <th>Voucher ID</th>
              <th>Status</th>
              <th>Tx ID</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="txTableBody">
            <!-- Populated via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Toast container for notifications -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/api.js"></script>
  <script src="js/adminController.js"></script>
</body>
</html>
